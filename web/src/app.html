<!doctype html>
<html lang="%lang%" dir="%dir%" data-theme="dark" data-surface="ink" data-accent="emerald">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("easyquran.prefs") || "{}");
          var r = JSON.parse(localStorage.getItem("easyquran.reader") || "{}");
          var d = document.documentElement;
          if (p.theme) d.dataset.theme = p.theme;
          if (p.surface) d.dataset.surface = p.surface;
          if (p.accent) d.dataset.accent = p.accent;
          var c = p.custom || {};
          if (c.bg) d.style.setProperty("--bg", c.bg);
          if (c.accent) d.style.setProperty("--accent", c.accent);
          if (c.pop) d.style.setProperty("--pop", c.pop);
          var qm = new URLSearchParams(location.search).get("mode");
          var rm =
            qm === "verse" || qm === "reading"
              ? qm
              : r.mode === "verse" || r.mode === "reading"
                ? r.mode
                : null;
          if (rm) d.dataset.readerMode = rm;
          if (typeof r.fontSize === "number" && r.fontSize >= 22 && r.fontSize <= 56) {
            d.style.setProperty("--reader-arabic-size", r.fontSize + "px");
          }
          if (
            typeof r.translationSize === "number" &&
            r.translationSize >= 13 &&
            r.translationSize <= 28
          ) {
            d.style.setProperty("--reader-translation-size", r.translationSize + "px");
          }
          if (r.lastRead && typeof r.lastRead.num === "number") {
            d.dataset.readerLastRead = "true";
          }
        } catch (e) {}
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
